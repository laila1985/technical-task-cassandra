# =====================================================================
# PCAP Processor - application configuration
# =====================================================================

# --- Input / output folders -------------------------------------------
# Folder scanned for new PCAP files (pcap / pcapng).
input.folder=./input
# Folder for extracted images (Level 5). Images are grouped per capture file.
output.folder=./output/images
# Folder used by the 'file' storage mode to persist processed data.
storage.file.folder=./output/data
# Move successfully processed files here (empty = leave in place).
processed.folder=./output/processed
# Move failed files here (empty = leave in place).
failed.folder=./output/failed
# Polling interval (ms) used by the input folder watcher.
watch.interval.ms=2000
# Extensions considered as capture files (comma separated, no dots).
input.extensions=pcap,pcapng,cap

# --- Threading (Level 2) ----------------------------------------------
# Maximum number of capture files processed concurrently.
threads.count=4
# Number of packets accumulated before a Cassandra batch insert is flushed.
db.batch.size=200
# Number of packets buffered per file before they are handed to the writer.
parser.buffer.size=1000

# --- Storage mode ------------------------------------------------------
# cassandra -> store to Cassandra (Level 3)
# file      -> store to local JSON/CSV files (useful when no DB is available)
# none      -> parse only, report statistics
storage.mode=cassandra

# --- Cassandra connection (Level 2 / 3) --------------------------------
cassandra.contact.points=127.0.0.1
cassandra.port=9042
cassandra.keyspace=pcap_analysis
cassandra.username=
cassandra.password=
cassandra.consistency=LOCAL_ONE
# Replication factor used when the keyspace is created on first run.
cassandra.replication.factor=1
# Retry connection this many times at startup before failing.
cassandra.connect.retries=5
# Delay (ms) between connection retries.
cassandra.connect.retry.delay.ms=2000

# --- Statistics / reporting -------------------------------------------
# Interval (ms) at which statistics are printed to the console.
stats.interval.ms=5000

# --- Image extraction (Level 5) ----------------------------------------
# Comma separated list of image content types to extract from HTTP traffic.
image.content.types=image/png,image/jpeg,image/jpg,image/gif,image/bmp,image/webp,image/tiff,image/svg+xml,image/x-icon
